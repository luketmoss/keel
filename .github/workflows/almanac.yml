name: almanac
on:
  pull_request:
    paths: ['almanac/**', '.github/workflows/almanac.yml']
  push:
    branches: [main]
    paths: ['almanac/**', '.github/workflows/almanac.yml']
concurrency:
  group: almanac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: almanac
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: almanac/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
