name: cairn
on:
  pull_request:
    paths: ['cairn/**', '.github/workflows/cairn.yml']
  push:
    branches: [main]
    paths: ['cairn/**', '.github/workflows/cairn.yml']
concurrency:
  group: cairn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cairn
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cairn/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # vitest's worker pool accumulates memory across a large, component-
      # heavy run and OOMs on a single `vitest run` well before the
      # runner's actual memory limit; sharding into separate processes
      # keeps each invocation's exposure small enough to finish cleanly.
      - run: npx vitest run --shard=1/6
      - run: npx vitest run --shard=2/6
      - run: npx vitest run --shard=3/6
      - run: npx vitest run --shard=4/6
      - run: npx vitest run --shard=5/6
      - run: npx vitest run --shard=6/6
      - run: npm run build
