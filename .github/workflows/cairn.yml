name: cairn
on:
  pull_request:
    paths: ['cairn/**', '.github/workflows/cairn.yml']
  push:
    branches: [main]
    paths: ['cairn/**', '.github/workflows/cairn.yml']
concurrency:
  group: cairn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cairn
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cairn/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: npm run build
