name: forage-pages
on:
  push:
    branches: [main]
    paths: ['forage/frontend/**', 'auth/**', 'ui/**', '.github/workflows/forage-pages.yml']
  workflow_dispatch:
# One group for every writer to gh-pages (cairn-pages.yml, thrive-pages.yml and
# hive-pages.yml use the same), so deploys never push at once. Not cancelled: a
# running deploy finishes. GitHub keeps one pending run per group, so if three
# queue together the middle one is dropped: workflow_dispatch is the recovery.
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: forage/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: forage/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # VITE_DEMO_MODE is never set here, so ?demo=true is ignored on the live
      # site. The API key and Sheet ID are not passed: the app reaches the
      # Sheet only through the API, with the signed-in user's token.
      - run: npm run build
        env:
          VITE_BASE_PATH: /keel/forage/
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.FORAGE_GOOGLE_CLIENT_ID }}
          VITE_FORAGE_API_URL: ${{ secrets.FORAGE_API_URL }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: forage/frontend/dist
          destination_dir: forage
          keep_files: true
