name: forage
on:
  pull_request:
    paths: ['forage/**', '.github/workflows/forage.yml']
  push:
    branches: [main]
    paths: ['forage/**', '.github/workflows/forage.yml']
concurrency:
  group: forage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forage/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: forage/frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check || { echo "::error::Unformatted files. Run 'npm run format' and commit the result."; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  apps-script:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forage/apps-script
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: forage/apps-script/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
