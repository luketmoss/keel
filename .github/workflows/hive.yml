name: hive
on:
  pull_request:
    paths: ['hive/**', '.github/workflows/hive.yml']
  push:
    branches: [main]
    paths: ['hive/**', '.github/workflows/hive.yml']
concurrency:
  group: hive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hive/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hive/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  apps-script:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hive/apps-script
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hive/apps-script/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
