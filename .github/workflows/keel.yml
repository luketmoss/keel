name: keel
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: keel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python .keel/check.py
