name: thrive-android
on:
  pull_request:
    paths: ['thrive/android/**', '.github/workflows/thrive-android.yml']
  push:
    branches: [main]
    paths: ['thrive/android/**', '.github/workflows/thrive-android.yml']
concurrency:
  group: thrive-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thrive/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # The wrapper jar is not committed yet (it is generated, see thrive/CLAUDE.md),
      # so Gradle comes from the pin in gradle-wrapper.properties instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - run: gradle test lintRelease
      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.THRIVE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No THRIVE_ANDROID_KEYSTORE_BASE64 secret: building an unsigned APK."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Assemble the release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.THRIVE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.THRIVE_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.THRIVE_ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: thrive-sip-apk
          path: thrive/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      # Installable without a keystore: Gradle signs a debug build with its own
      # generated debug key. Fine for sideloading to the owner's phone; the
      # release APK above is the signed one once the secrets exist.
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: thrive-sip-debug-apk
          path: thrive/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
