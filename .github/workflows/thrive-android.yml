name: thrive-android
on:
  pull_request:
    paths: ['thrive/android/**', '.github/workflows/thrive-android.yml']
  push:
    branches: [main]
    paths: ['thrive/android/**', '.github/workflows/thrive-android.yml']
concurrency:
  group: thrive-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thrive/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew test lintRelease
      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.THRIVE_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.THRIVE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THRIVE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.THRIVE_ANDROID_KEY_PASSWORD }}
          EVENT: ${{ github.event_name }}
        run: |
          # Names only, never values. A push to main must produce a signed APK;
          # a pull_request may not see secrets (Dependabot), so it builds unsigned.
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing THRIVE_ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing THRIVE_ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing THRIVE_ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing THRIVE_ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            if [ "$EVENT" = "push" ]; then
              echo "::error::Signing secret(s) missing:$missing. A push to main must build a signed APK."
              exit 1
            fi
            echo "::warning::Signing secret(s) missing:$missing. Building an unsigned APK."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Assemble the release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.THRIVE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.THRIVE_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.THRIVE_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: thrive-sip-apk
          path: thrive/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
