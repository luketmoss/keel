name: thrive
on:
  pull_request:
    paths: ['thrive/**', 'geo/**', 'auth/**', 'ui/tokens/**', '.github/workflows/thrive.yml']
  push:
    branches: [main]
    paths: ['thrive/**', 'geo/**', 'auth/**', 'ui/tokens/**', '.github/workflows/thrive.yml']
concurrency:
  group: thrive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thrive/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: thrive/frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check || { echo "::error::Unformatted files. Run 'npm run format' and commit the result."; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  apps-script:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thrive/apps-script
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: thrive/apps-script/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thrive/sync
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: thrive/sync/package-lock.json
      - run: npm ci
      - run: npm test

  # No stack skill: one-off migrations and admin tools. This proves each
  # script still parses and that its imports install, and runs the few that
  # have tests (#681's matching rules).
  scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thrive/scripts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: thrive/scripts/package-lock.json
      - run: npm ci
      - run: for f in *.mjs; do node --check "$f"; done
      - run: node --test *.test.mjs
