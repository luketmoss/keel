<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almanac</title>
<style>
/* Tokens follow Thrive and Hive (spacing, radius, type scale, neutrals, badge colours).
   Almanac's own accent is set on #app so the prototype can swap candidates. */
:root{
  color-scheme:light;
  --radius-sm:4px;--radius-md:8px;--radius-lg:16px;--radius-full:9999px;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
  --font-mono:"SF Mono","Fira Code","Fira Mono",Menlo,Consolas,monospace;
  --text-xs:.75rem;--text-sm:.875rem;--text-base:1rem;--text-lg:1.125rem;--text-xl:1.25rem;--text-2xl:1.5rem;--text-3xl:1.875rem;
  --nav-h:64px;--top-h:56px;

  --color-bg:#f0f2f5;--color-surface:#ffffff;--color-surface-raised:#f7f8fa;--color-sunken:#e9ecf0;
  --color-border:#dadce0;--color-border-light:#e8eaed;
  --color-text:#1f1f1f;--color-text-secondary:#5f6368;--color-text-muted:#62686f;
  --color-overdue:#b71c1c;
  --color-warning:#a05d00;--color-warning-tint:#fff4e0;
  --color-success:#2e7d32;--color-success-tint:#e8f5e9;
  --color-serious:#b4480f;--color-serious-tint:#fdeee5;
  --color-danger:#c62828;--color-danger-tint:#fdecea;
  --shadow-lg:0 12px 32px rgba(16,24,40,.18);
  --overlay:rgba(15,18,25,.45);
  --grid:#e8eaee;--axis:#c6cad0;--dot:#a0a6ae;
  --thrive:#2f66f0;--hive:#f5b700;
  --sleep-awake:#94a4f6;--sleep-rem:#6f81ea;--sleep-light:#4555cf;--sleep-deep:#252c8a;
  --b-weight-bg:#fde8e8;--b-weight-fg:#c53030;--b-stretch-bg:#e8f5e9;--b-stretch-fg:#2e7d32;
  --b-bike-bg:#e3f2fd;--b-bike-fg:#1565c0;--b-hike-bg:#efebe9;--b-hike-fg:#5d4037;
  --b-run-bg:#fce7f3;--b-run-fg:#9d174d;--b-walk-bg:#d7f2ee;--b-walk-fg:#10605a;
}
#app{--accent:#9d5cf0;--primary:#7b3fc4;--primary-hover:#6a33ab;--primary-tint:#f3ecfd;--on-primary:#ffffff;--band:rgba(157,92,240,.12);--band-strong:rgba(157,92,240,.28)}
#app[data-accent="teal"]{--accent:#14b8a6;--primary:#0b7a70;--primary-hover:#09665d;--primary-tint:#e3f6f3;--band:rgba(20,184,166,.15);--band-strong:rgba(20,184,166,.34)}
#app[data-accent="violet"]{--accent:#7c5cff;--primary:#5b3fd6;--primary-hover:#4a30bd;--primary-tint:#efebff;--band:rgba(124,92,255,.13);--band-strong:rgba(124,92,255,.30)}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --color-bg:#121212;--color-surface:#1a1a1e;--color-surface-raised:#222226;--color-sunken:#2a2a30;
    --color-border:#34343a;--color-border-light:#2a2a2f;
    --color-text:#e8eaed;--color-text-secondary:#a4aab1;--color-text-muted:#8f959c;
    --color-overdue:#ff6b6b;
    --color-warning:#ffb74d;--color-warning-tint:#2d2210;
    --color-success:#66bb6a;--color-success-tint:#15291a;
    --color-serious:#ff9a6b;--color-serious-tint:#2d1a10;
    --color-danger:#ef5350;--color-danger-tint:#2d1414;
    --shadow-lg:0 12px 32px rgba(0,0,0,.55);--overlay:rgba(0,0,0,.6);
    --grid:#2a2a30;--axis:#3d3d44;--dot:#6d737b;
    --thrive:#6e97ff;
    --sleep-awake:#c9d2ff;--sleep-rem:#95a3ff;--sleep-light:#6474ea;--sleep-deep:#3a45b8;
    --b-weight-bg:#3b1515;--b-weight-fg:#fca5a5;--b-stretch-bg:#14291a;--b-stretch-fg:#86efac;
    --b-bike-bg:#0d1f33;--b-bike-fg:#93c5fd;--b-hike-bg:#2c1f1a;--b-hike-fg:#d7ccc8;
    --b-run-bg:#2e1022;--b-run-fg:#f5a8d3;--b-walk-bg:#0c2a28;--b-walk-fg:#7fded3;
  }
  :root:not([data-theme="light"]) #app{--primary:#c89bff;--primary-hover:#d9b9ff;--primary-tint:#2a1d3d;--on-primary:#1e0b33;--band:rgba(200,155,255,.13);--band-strong:rgba(200,155,255,.30)}
  :root:not([data-theme="light"]) #app[data-accent="teal"]{--on-primary:#04201c;--primary:#34d1bf;--primary-hover:#5eead4;--primary-tint:#0e2a27;--band:rgba(52,209,191,.13);--band-strong:rgba(52,209,191,.30)}
  :root:not([data-theme="light"]) #app[data-accent="violet"]{--primary:#a38fff;--primary-hover:#b9aaff;--primary-tint:#241d40;--band:rgba(163,143,255,.14);--band-strong:rgba(163,143,255,.32)}
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --color-bg:#121212;--color-surface:#1a1a1e;--color-surface-raised:#222226;--color-sunken:#2a2a30;
  --color-border:#34343a;--color-border-light:#2a2a2f;
  --color-text:#e8eaed;--color-text-secondary:#a4aab1;--color-text-muted:#8f959c;
  --color-overdue:#ff6b6b;
  --color-warning:#ffb74d;--color-warning-tint:#2d2210;
  --color-success:#66bb6a;--color-success-tint:#15291a;
  --color-serious:#ff9a6b;--color-serious-tint:#2d1a10;
  --color-danger:#ef5350;--color-danger-tint:#2d1414;
  --shadow-lg:0 12px 32px rgba(0,0,0,.55);--overlay:rgba(0,0,0,.6);
  --grid:#2a2a30;--axis:#3d3d44;--dot:#6d737b;
  --thrive:#6e97ff;
  --sleep-awake:#c9d2ff;--sleep-rem:#95a3ff;--sleep-light:#6474ea;--sleep-deep:#3a45b8;
  --b-weight-bg:#3b1515;--b-weight-fg:#fca5a5;--b-stretch-bg:#14291a;--b-stretch-fg:#86efac;
  --b-bike-bg:#0d1f33;--b-bike-fg:#93c5fd;--b-hike-bg:#2c1f1a;--b-hike-fg:#d7ccc8;
  --b-run-bg:#2e1022;--b-run-fg:#f5a8d3;--b-walk-bg:#0c2a28;--b-walk-fg:#7fded3;
}
:root[data-theme="dark"] #app{--primary:#c89bff;--primary-hover:#d9b9ff;--primary-tint:#2a1d3d;--on-primary:#1e0b33;--band:rgba(200,155,255,.13);--band-strong:rgba(200,155,255,.30)}
:root[data-theme="dark"] #app[data-accent="teal"]{--on-primary:#04201c;--primary:#34d1bf;--primary-hover:#5eead4;--primary-tint:#0e2a27;--band:rgba(52,209,191,.13);--band-strong:rgba(52,209,191,.30)}
:root[data-theme="dark"] #app[data-accent="violet"]{--primary:#a38fff;--primary-hover:#b9aaff;--primary-tint:#241d40;--band:rgba(163,143,255,.14);--band-strong:rgba(163,143,255,.32)}

/* ===== Base ===== */
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
.ico-xs{width:13px;height:13px;stroke-width:2.2;display:inline-block;vertical-align:-2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--color-text-muted)}
.spacer{flex:1}

/* ===== Top bar & navigation ===== */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:12px;height:var(--top-h);padding-inline:16px;background:color-mix(in srgb,var(--color-bg) 88%,transparent);-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3)}
.brand{display:flex;align-items:center;gap:8px;min-height:44px}
.logo{width:28px;height:28px;display:block}
.wordmark{font-size:1.125rem;font-weight:700;letter-spacing:-.01em}
.top-tabs{display:none;gap:2px;padding:3px;margin-inline:auto;border-radius:var(--radius-full);background:var(--color-sunken)}
.top-tab{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:600;color:var(--color-text-secondary)}
.top-tab .ico{width:18px;height:18px}
.top-tab[aria-current="page"]{background:var(--color-surface);color:var(--color-text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
.today-chip{min-height:36px;padding:0 14px;border-radius:var(--radius-full);background:var(--primary-tint);color:var(--primary);font-size:var(--text-sm);font-weight:700}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--radius-full);color:var(--color-text-secondary)}
.icon-btn:hover{background:var(--color-sunken);color:var(--color-text)}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--color-surface);border-top:1px solid var(--color-border)}
.nav-tab{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--text-xs);font-weight:600;color:var(--color-text-secondary)}
.nav-tab .ico{width:22px;height:22px}
.nav-tab[aria-current="page"]{color:var(--primary)}
.main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))}

/* ===== Day header & week strip ===== */
.day-head{padding-top:6px}
.day-head h1{font-size:var(--text-3xl);line-height:1.1;font-weight:700;letter-spacing:-.02em}
.day-sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:2px;color:var(--color-text-secondary)}
.rel-pill{display:inline-flex;align-items:center;min-height:22px;padding:0 9px;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:700;background:var(--color-sunken);color:var(--color-text-secondary)}
.rel-pill.today{background:var(--primary-tint);color:var(--primary)}
.sunline{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:6px;font-size:var(--text-sm);color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.sunline span{display:inline-flex;align-items:center;gap:5px}
.sunline .ico{width:16px;height:16px}
.week{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr)) 28px;align-items:center;gap:2px;margin:12px -6px 12px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.wk-arrow{height:56px;display:grid;place-items:center;border-radius:var(--radius-md);color:var(--color-text-secondary)}
.wk-arrow:hover{background:var(--color-sunken)}
.wk-day{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:62px;padding:6px 0 6px;border-radius:12px}
.wk-day:hover{background:var(--color-sunken)}
.wk-dow{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--color-text-secondary)}
.wk-num{font-size:var(--text-lg);font-weight:650;line-height:1.3;font-variant-numeric:tabular-nums}
.wk-marks{display:flex;gap:3px;height:6px;align-items:center}
.wk-marks i{display:block;width:5px;height:5px;border-radius:50%;background:var(--color-text-muted)}
.wk-marks i.plan{background:transparent;box-shadow:inset 0 0 0 1.3px var(--color-text-muted)}
.wk-day.is-today{box-shadow:inset 0 0 0 1.5px var(--primary)}
.wk-day.is-today .wk-num{color:var(--primary)}
.wk-day[aria-pressed="true"]{background:var(--primary)}
.wk-day[aria-pressed="true"] .wk-dow,.wk-day[aria-pressed="true"] .wk-num{color:var(--on-primary)}
.wk-day[aria-pressed="true"] .wk-marks i{background:var(--on-primary)}
.wk-day[aria-pressed="true"] .wk-marks i.plan{background:transparent;box-shadow:inset 0 0 0 1.3px var(--on-primary)}

/* ===== Cards ===== */
.day-body{touch-action:pan-y}
.day-grid,.colA,.colB{display:flex;flex-direction:column;gap:12px}
.colA,.colB{display:contents}
.c-vitals{order:1}.c-train{order:2}.c-todo{order:3}.c-body{order:4}.c-journal{order:5}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden}
.card-head{display:flex;align-items:center;gap:8px;min-height:46px;padding:8px 10px 4px 16px}
.card-title{font-size:var(--text-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-secondary)}
.card-sub{font-size:var(--text-xs);color:var(--color-text-muted);white-space:nowrap}
.src{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:var(--radius-full);border:1px solid var(--color-border-light);background:var(--color-surface-raised);font-size:11px;font-weight:600;color:var(--color-text-secondary);white-space:nowrap}
.src i{display:block;width:7px;height:7px;border-radius:50%;background:var(--color-text-muted)}
.src.thrive i{background:var(--thrive)}.src.hive i{background:var(--hive)}
.head-action{margin-left:auto;display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 10px;border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:700;color:var(--primary);white-space:nowrap}
.head-action .ico{width:16px;height:16px;stroke-width:2.2}
.head-action:hover{background:var(--primary-tint)}
.soft{display:flex;gap:8px;align-items:flex-start;padding:4px 16px 14px;font-size:var(--text-sm);color:var(--color-text-secondary)}
.soft .ico{width:18px;height:18px;margin-top:1px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;column-gap:12px;align-items:start;width:100%;padding:12px 16px;text-align:left}
.rows > .row + .row{border-top:1px solid var(--color-border-light)}
button.row:hover{background:var(--color-surface-raised)}
.row > .ico{margin-top:1px;color:var(--color-text-secondary)}
.rc{display:block;min-width:0}
.row-label{display:block;font-size:var(--text-sm);font-weight:650}
.row-cap{display:block;margin-top:4px;font-size:var(--text-xs);color:var(--color-text-secondary)}
.row-value{display:flex;align-items:center;gap:4px;font-size:var(--text-xl);font-weight:650;line-height:1.2;white-space:nowrap}
.row-value small{font-size:var(--text-sm);font-weight:500;color:var(--color-text-secondary)}
.row-value .go{width:15px;height:15px;color:var(--color-text-muted);stroke-width:2.2}
.you{color:var(--color-text);font-weight:600}
.status{display:inline-flex;align-items:center;gap:2px;font-weight:700}
.status.attn{color:var(--color-warning)}
.rbar{position:relative;display:block;height:8px;margin-top:9px;border-radius:4px;background:var(--color-sunken)}
.rbar .band{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--band-strong)}
.rbar .mk{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 2px var(--color-surface)}
.rbar .mk.attn{background:var(--color-warning)}
.stages{display:flex;gap:2px;height:10px;margin-top:9px}
.stages span{display:block;border-radius:2px;min-width:3px}
.stages span:first-child{border-radius:4px 2px 2px 4px}.stages span:last-child{border-radius:2px 4px 4px 2px}
.st-deep{background:var(--sleep-deep)}.st-light{background:var(--sleep-light)}.st-rem{background:var(--sleep-rem)}.st-awake{background:var(--sleep-awake)}
.stage-legend{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px;font-size:var(--text-xs);color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.stage-legend b{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:2px}
.wait{display:flex;gap:10px;margin:4px 16px 14px;padding:12px;border-radius:var(--radius-md);background:var(--color-warning-tint);color:var(--color-text);font-size:var(--text-sm)}
.wait .ico{color:var(--color-warning);margin-top:1px}
.wait b{display:block}
</style>
<style>
/* ===== Check-in (the only thing Almanac writes, with the journal) ===== */
.checkin{padding:10px 16px 12px;border-top:1px solid var(--color-border-light);background:var(--color-surface-raised)}
.ck-head{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.ck-title{font-size:var(--text-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-secondary)}
.unset{font-size:var(--text-xs);color:var(--color-text-muted)}
.ck-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;flex-wrap:wrap}
.ck-label{font-size:var(--text-sm);font-weight:600}
.seg{display:inline-flex;gap:4px}
.seg button{min-width:58px;min-height:40px;padding:0 10px;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-surface);font-size:var(--text-sm);font-weight:600;color:var(--color-text-secondary);text-align:center}
.seg button:hover{border-color:var(--color-text-muted)}
.seg button[aria-pressed="true"]{background:var(--primary-tint);border-color:var(--primary);color:var(--primary);font-weight:700;box-shadow:inset 0 0 0 1px var(--primary)}
.hours{display:inline-flex;align-items:center;gap:6px}
.hours input{width:78px;min-height:40px;padding:0 10px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.hours input::-webkit-inner-spin-button,.hours input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.hours input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--band-strong)}
.hours .unit{font-size:var(--text-sm);color:var(--color-text-secondary)}
.clear{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--color-text-muted)}
.clear:hover{background:var(--color-sunken);color:var(--color-text)}
.clear .ico{width:16px;height:16px}
.ck-hint{margin-top:4px;font-size:var(--text-xs);color:var(--color-text-muted)}

/* ===== Training (Thrive) ===== */
.acts{display:flex;flex-direction:column;gap:8px;padding:2px 12px 12px}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);text-align:left;transition:border-color .15s ease}
.act:hover{border-color:var(--primary)}
.act.planned{border:1.5px dashed var(--color-border);background:var(--color-surface-raised)}
.act.planned:hover{border-color:var(--primary)}
.act-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.act-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.act-time{margin-left:auto;font-size:var(--text-xs);color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.act-name{font-weight:650;overflow-wrap:anywhere}
.act-meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:var(--text-sm);color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.act-meta span{display:inline-flex;align-items:center;gap:3px}
.act-go{color:var(--color-text-muted)}
.act-go .ico{width:18px;height:18px}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:var(--radius-full);font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.badge.weight{background:var(--b-weight-bg);color:var(--b-weight-fg)}.badge.stretch{background:var(--b-stretch-bg);color:var(--b-stretch-fg)}
.badge.bike{background:var(--b-bike-bg);color:var(--b-bike-fg)}.badge.hike{background:var(--b-hike-bg);color:var(--b-hike-fg)}
.badge.run{background:var(--b-run-bg);color:var(--b-run-fg)}.badge.walk{background:var(--b-walk-bg);color:var(--b-walk-fg)}
.badge.plan{background:var(--primary-tint);color:var(--primary);border:1.5px dashed var(--primary)}
.badge.miss{background:var(--color-danger-tint);color:var(--color-overdue);border:1.5px dashed var(--color-overdue)}
.eff{font-weight:700}.eff.easy{color:var(--color-success)}.eff.medium{color:var(--color-warning)}.eff.hard{color:var(--color-danger)}
.empty{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:2px 4px 2px;font-size:var(--text-sm);color:var(--color-text-secondary)}

    { gap: 46, t: s => dd(s) === 1 || dd(s) === 15, fm: s => f(s, { month: 'short', day: 'numeric' }) },
    { gap: 30, t: s => dd(s) === 1, fm: s => f(s, { month: 'short' }) },

  v.innerHTML = S.tab === 'today' ? viewDay(S.date) : S.tab === 'calendar' ? viewCalendar() : viewTrends();
  if (S.tab === 'trends' && !S.tTable) drawCharts();
  if (opts.anim) { const b = $('#dayBody'); if (b) b.classList.add(opts.anim); }
  if (active) { const el = document.getElementById(active); if (el && el.focus) el.focus({ preventScroll: true }); }
  savePrefs();
}
function go(s, anim) { if (s === S.date) return; const dir = anim || (s > S.date ? 'anim-l' : 'anim-r'); S.date = s; render({ anim: dir }); }
function shiftMonth(dir) { const [y, m] = S.calMonth.split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + dir, 1, 12)); S.calMonth = toIso(d).slice(0, 7); render(); }
function groupFor(k) { if (k === 'weight') return 'body'; if (k === 'bp') return 'bp'; if (k === 'steps') return 'activity'; return 'recovery'; }

/* ================= Toast ================= */
let toastTimer = null;
function toast(html) { const t = $('#toast'); t.innerHTML = html; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4600); }
function toastExt(app, what, route) {
  const name = app === 'thrive' ? 'Thrive' : 'Hive';
  toast(`<span class="t-app ${app}"><i></i>Opens ${name}</span><span>${esc(cap(what))}</span><code>${esc((app === 'thrive' ? 'luketmoss.github.io/thrive/' : 'luketmoss.github.io/hive/') + route)}</code>`);
}

/* ================= Sheets ================= */
const SCENARIOS = [
  ['presync', 'Before today\'s first sync', 'Nothing for today has arrived yet, so each number says it arrives with the next sync.'],
  ['normal', 'After the morning sync (8:17 AM)', 'Last night is in; steps have barely started.'],
  ['midday', 'After a midday sync (1:17 PM)', 'Steps show progress toward the goal.'],
  ['nowatch', 'Watch not worn last night', 'Sleep and HRV stay blank, never zero. Your check-in hours stand in.'],
  ['rest', 'Nothing planned today', 'The Training card offers to plan a workout in Thrive.'],
  ['busy', 'Busy to-do list', 'Ten more Hive items. Groups collapse after four.'],
];
const DECIDED = [
  ['Look and stack', 'Preact and Almanac\'s own CSS, following Thrive and Hive. Not Alpenglow.'],
  ['Colour', 'Amethyst.'],
  ['Your range', 'Mean ± 1 SD of the 30 days before, once there are 14 values.'],
  ['Freshness', 'Numbers appear once synced, and say "Arrives with the next sync" until then. Totals like steps grow through the day. Past days show the completed day.'],
  ['Step goal', 'Taken from COROS if its data carries one. Almanac stores no goals.'],
  ['Withings', 'After the first version (keel#354). Kept here for when it arrives.'],
  ['Reopened Hive items', 'Struck through, with the time it was reopened.'],
  ['Hive boards', 'All five.'],
  ['Sunrise and sunset', 'Kept.'],
];
const STILL_OPEN = [
  ['Does COROS expose a step goal?', 'Its MCP docs list no goal field. Check a real daily payload during sync work.'],
  ['Sync cadence', 'You\'re adding daytime runs, with a sync button later. The times here are placeholders.'],
  ['New links into Thrive and Hive', 'Thrive: plan a workout on a date. Hive: a new item with a due date, and opening one item (hive#240).'],
];
function sheet(html, labelId) {
  const root = $('#sheetRoot');
  root.innerHTML = `<div class="sheet-backdrop" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="${labelId}"><div class="grabber" aria-hidden="true"></div>${html}</div></div>`;
  root.hidden = false;
  const first = root.querySelector('button:not([data-act="backdrop"])'); if (first) first.focus({ preventScroll: true });
}
function closeSheet() { const root = $('#sheetRoot'); root.hidden = true; root.innerHTML = ''; }
function optionsHTML() {
  const pressed = (a, b) => String(a === b);
  const toggle = (act, on, title, dsc) => `<button class="opt" data-act="${act}" aria-pressed="${on}">${ic(on ? 'check' : 'plus')}<span><b>${title}</b><small>${dsc}</small></span></button>`;
  return `<div class="sheet-head"><h2 id="optTitle">Design options</h2><button class="icon-btn" data-act="close-sheet" aria-label="Close">${ic('x')}</button></div>
  <p class="sheet-sub">Prototype-only controls for previewing states. They are not part of Almanac.</p>
  <div class="opt-sec"><h3>Theme</h3><span class="segd" role="group" aria-label="Theme">${[['system', 'System'], ['light', 'Light'], ['dark', 'Dark']].map(([k, n]) => `<button data-act="theme" data-k="${k}" aria-pressed="${pressed(S.theme, k)}">${n}</button>`).join('')}</span></div>
  <div class="opt-sec"><h3>Today's data</h3><p>Changes only today, to preview states you would otherwise wait for.</p><div class="opt-list">${SCENARIOS.map(([k, n, dsc]) => `<button class="opt" data-act="scenario" data-k="${k}" aria-pressed="${pressed(S.scenario, k)}">${ic(S.scenario === k ? 'check' : 'clock')}<span><b>${n}</b><small>${dsc}</small></span></button>`).join('')}</div></div>
  <div class="opt-sec"><h3>Data that may not exist yet</h3><div class="opt-list">
    ${toggle('stepgoal', S.stepGoal, 'COROS provides a step goal', 'On: steps fill toward an 8,000 goal. Off: steps sit against your range instead.')}
    ${toggle('withings', S.withings, 'Show Withings weight and blood pressure', 'Not in the first version (keel#354). On keeps the design visible.')}
  </div></div>
  <div class="opt-sec"><h3>Decided</h3><ol class="decisions">${DECIDED.map(([t, dsc]) => `<li>${t}<span>${dsc}</span></li>`).join('')}</ol></div>
  <div class="opt-sec"><h3>Still open</h3><ol class="decisions">${STILL_OPEN.map(([t, dsc]) => `<li>${t}<span>${dsc}</span></li>`).join('')}</ol></div>
  <div class="opt-sec"><button class="btn btn-outline btn-sm" data-act="reset">Reset check-ins and journal to the sample</button></div>`;
}
const openOptions = () => sheet(optionsHTML(), 'optTitle');
const refreshOptions = () => { if (!$('#sheetRoot').hidden && $('#optTitle')) { const sc = $('.sheet').scrollTop; $('.sheet').innerHTML = '<div class="grabber" aria-hidden="true"></div>' + optionsHTML(); $('.sheet').scrollTop = sc; } };
function customHTML() {
  return `<div class="sheet-head"><h2 id="custTitle">Custom group</h2><button class="icon-btn" data-act="close-sheet" aria-label="Close">${ic('x')}</button></div>
  <p class="sheet-sub">Pick up to four. They stack on one shared date axis — never two scales on one chart.</p>
  <div class="opt-list">${CUSTOMABLE.map(k => { const on = S.custom.includes(k); return `<button class="opt" data-act="custom-toggle" data-k="${k}" aria-pressed="${on}">${ic(on ? 'check' : 'plus')}<span><b>${METRICS[k].label}</b></span></button>`; }).join('')}</div>
  <p style="margin-top:14px"><button class="btn btn-primary" data-act="close-sheet">Done</button></p>`;
}

/* ================= Events ================= */
let swiped = false, sw = null;
document.addEventListener('click', e => { if (swiped) { e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, k = t.dataset.k;
  if (a === 'backdrop') { if (e.target === t) closeSheet(); return; }
  switch (a) {
    case 'home': S.tab = 'today'; S.date = TODAY; render(); window.scrollTo(0, 0); break;
    case 'tab': S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'goto': go(t.dataset.date); break;
    case 'week': go(add(S.date, 7 * Number(t.dataset.dir)), Number(t.dataset.dir) > 0 ? 'anim-l' : 'anim-r'); break;
    case 'today': if (S.tab === 'calendar') { S.calMonth = TODAY.slice(0, 7); S.calSel = TODAY; render(); } else go(TODAY); break;
    case 'trend': S.tab = 'trends'; S.tGroup = groupFor(t.dataset.metric); S.tTable = false; render(); window.scrollTo(0, 0); break;
    case 'ext': toastExt(t.dataset.app, t.dataset.what, t.dataset.route); break;
    case 'ck': { const cur = checkin(S.date)[t.dataset.field]; setCk(t.dataset.field, cur === t.dataset.val ? '' : t.dataset.val); break; }
    case 'ck-clear': setCk(t.dataset.field, null); break;
    case 'more': S.expand[k] = !S.expand[k]; render(); break;
    case 'month': shiftMonth(Number(t.dataset.dir)); break;
    case 'calcolor': S.calColor = k; render(); break;
    case 'calsel': S.calSel = t.dataset.date; if (t.classList.contains('out')) S.calMonth = t.dataset.date.slice(0, 7); render(); break;
    case 'openday': S.tab = 'today'; S.date = t.dataset.date; render(); window.scrollTo(0, 0); break;
    case 'tgroup': S.tGroup = k; if (k === 'custom' && !S.custom.length) S.custom = ['rhr', 'hrv', 'energy']; render(); break;
    case 'trange': S.tRange = k; render(); break;
    case 'tavg': S.tAvg = Number(k); render(); break;
    case 'ttable': S.tTable = !S.tTable; render(); break;
    case 'custom-edit': sheet(customHTML(), 'custTitle'); break;
    case 'custom-toggle': {
      const i = S.custom.indexOf(k);
      if (i >= 0) S.custom.splice(i, 1); else if (S.custom.length < 4) S.custom.push(k); else toast('Four metrics at most — remove one first.');
      render(); $('.sheet').innerHTML = '<div class="grabber" aria-hidden="true"></div>' + customHTML(); break;
    }
    case 'options': openOptions(); break;
    case 'close-sheet': closeSheet(); break;
    case 'stepgoal': S.stepGoal = !S.stepGoal; render(); refreshOptions(); break;
    case 'withings': S.withings = !S.withings; render(); refreshOptions(); break;
    case 'theme': S.theme = k; applyTheme(); render(); refreshOptions(); break;
    case 'scenario': S.scenario = k; S.tab = 'today'; S.date = TODAY; S.expand = {}; render(); refreshOptions(); break;
    case 'reset': S.edits = {}; render(); refreshOptions(); toast('Check-ins and journal are back to the sample data.'); break;
  }
});
function setCk(field, val) { const e = S.edits[S.date] || (S.edits[S.date] = {}); e[field] = val; render(); }

let noteTimer = null;
document.addEventListener('input', e => {
  if (e.target.id !== 'note') return;
  const ed = S.edits[S.date] || (S.edits[S.date] = {}); ed.note = e.target.value;
  const flag = $('#savedFlag'); if (flag) flag.textContent = 'Saving…';
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { savePrefs(); const fl = $('#savedFlag'); if (fl) fl.innerHTML = e.target.value ? ic('check') + 'Saved' : ''; }, 500);
});
document.addEventListener('change', e => {
  if (e.target.id !== 'ck-hours') return;
  const raw = e.target.value.trim(), v = parseFloat(raw);
  setCk('sleep_hours', raw === '' || isNaN(v) ? null : Math.max(0, Math.min(16, Math.round(v * 4) / 4)));
});

/* Swipe: day body and week strip change days/weeks, the calendar grid changes months. */
document.addEventListener('pointerdown', e => {
  const area = e.target.closest('#dayBody, #week, #calGrid');
  if (!area || e.target.closest('textarea, input')) { sw = null; return; }
  sw = { x: e.clientX, y: e.clientY, id: area.id, t: Date.now() };
});
document.addEventListener('pointerup', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - sw.t < 900) {
    swiped = true; setTimeout(() => { swiped = false; }, 350);
    const dir = dx < 0 ? 1 : -1;
    if (sw.id === 'calGrid') shiftMonth(dir);
    else if (sw.id === 'week') go(add(S.date, 7 * dir), dir > 0 ? 'anim-l' : 'anim-r');
    else go(add(S.date, dir), dir > 0 ? 'anim-l' : 'anim-r');
  }
  sw = null;
});
document.addEventListener('pointercancel', () => { sw = null; });

/* Chart scrubbing: hover or drag to read every chart in the group at one date; click (or tap twice) opens that day. */
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('#trendGrid .chart'); if (!el) return;
  tipState.touch = e.pointerType !== 'mouse';
  const i = chartIndex(el, e.clientX);
  tipState.wasShown = tipState.shown && tipState.i === i;
  if (i >= 0) showTip(i, e.clientX, e.clientY);
});
document.addEventListener('pointermove', e => {
  const el = e.target.closest && e.target.closest('#trendGrid .chart');
  if (!el) { if (tipState.shown && e.pointerType === 'mouse' && !tipState.touch) hideTip(); return; }
  if (e.pointerType === 'mouse') tipState.touch = false;
  const i = chartIndex(el, e.clientX); if (i >= 0) showTip(i, e.clientX, e.clientY);
});
document.addEventListener('click', e => {
  const el = e.target.closest('#trendGrid .chart');
  if (!el) { if (tipState.shown && tipState.touch && !e.target.closest('#tip')) hideTip(); return; }
  const m = CHART_META.get(el); if (!m) return;
  const i = chartIndex(el, e.clientX);
  if (!tipState.touch || tipState.wasShown) { S.tab = 'today'; S.date = add(m.from, i); render(); window.scrollTo(0, 0); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#sheetRoot').hidden) closeSheet(); else hideTip(); return; }
  if (e.target.closest('input, textarea') || !$('#sheetRoot').hidden || S.tab !== 'today') return;
  if (e.key === 'ArrowLeft') go(add(S.date, -1)); else if (e.key === 'ArrowRight') go(add(S.date, 1)); else if (e.key === 't') go(TODAY);
});
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (S.tab === 'trends' && !S.tTable) { hideTip(); drawCharts(); } }, 150); });
window.addEventListener('scroll', () => { if (tipState.shown) hideTip(); }, { passive: true });

/* ================= Boot ================= */
loadPrefs();
applyTheme();
render();
</script>
