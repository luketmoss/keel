    <!-- data-theme before first paint: the neutrals exist only under it. src/theme.ts keeps it current. -->

      document.documentElement.setAttribute(
        'data-theme',
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
      );
    </script>
    <!-- No Google Identity Services tag here: the live sign-in loads it (src/auth/gis-script.ts), so demo mode
