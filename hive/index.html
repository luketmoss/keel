  <!-- AC4: Apply data-theme before first paint to prevent flash of wrong theme -->
  <script>
    (function() {
      // Resolved outside the try: with storage blocked, data-theme must still
      // be set before first paint, because the neutrals exist only under it.
      var resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      try {
        var t = localStorage.getItem('hive-theme');
        if (t === 'dark' || t === 'light') resolved = t;
      } catch(e) {}
      document.documentElement.setAttribute('data-theme', resolved);
    })();
  </script>
