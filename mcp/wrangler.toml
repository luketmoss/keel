name = "keel-mcp"
main = "src/index.ts"
compatibility_date = "2025-09-01"
# Client ID Metadata Documents fetch a client's metadata from its own URL.
# nodejs_als: per-tool-call state (src/call-context.js) survives awaits without module state.
compatibility_flags = ["global_fetch_strictly_public", "nodejs_als"]

# Non-secret configuration. Secrets are set with `wrangler secret put` and are
# listed in .dev.vars.example.
[vars]
# Set when the GitHub OAuth app is created (#369).
GITHUB_CLIENT_ID = "Ov23lieyNEsMK4XTtE7m"
# Write ceilings (#410). A missing or malformed value falls back to these, never to "unlimited".
# Rows one call may write before it is held for `confirm: true` (Thrive's four bulk tools).
MAX_ROWS_PER_CALL = "200"
# Per app, over a rolling 60 minutes: write calls, or rows, whichever comes first.
MAX_WRITES_PER_HOUR = "40"
MAX_ROWS_PER_HOUR = "600"

# No id: wrangler creates the namespace on first deploy and records it.
[[kv_namespaces]]
binding = "OAUTH_KV"

# The hourly write counters (#410): one Durable Object per app, holding only timestamps and row counts.
[[durable_objects.bindings]]
name = "WRITE_BUDGET"
class_name = "WriteBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WriteBudget"]
