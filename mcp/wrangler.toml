name = "keel-mcp"
main = "src/index.ts"
compatibility_date = "2025-09-01"
# Client ID Metadata Documents fetch a client's metadata from its own URL.
compatibility_flags = ["global_fetch_strictly_public"]

# Non-secret configuration. Secrets are set with `wrangler secret put` and are
# listed in .dev.vars.example.
[vars]
# Set when the GitHub OAuth app is created (#369).
GITHUB_CLIENT_ID = "Ov23lieyNEsMK4XTtE7m"

# No id: wrangler creates the namespace on first deploy and records it.
[[kv_namespaces]]
binding = "OAUTH_KV"
