/* Nightly brief (#829). Layout: one column on a phone, tonight first; Tonight, Today, Next 5 days, foot.
   Morning template layout notes follow, whose tokens and helpers this page shares.
   One column on a phone, summary first. Today's call (level gauge, the session, the signals), your day on one
   time axis (weather, sessions, calendar, wake and bed), last night, yesterday beside training load, the next 3 days,

:root {

  --t-weight: #c53030; --t-stretch: #2e7d32; --t-bike: #1565c0; --t-hike: #5d4037; --t-run: #9d174d; --t-walk: #10605a;

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 960px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.num { font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border-radius: var(--r-lg); padding: 16px; min-width: 0; }
.ch { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; margin-bottom: 12px; }
.ch h2 { font-size: 1rem; font-weight: 600; white-space: nowrap; }
.ch .aside { font-size: .8125rem; color: var(--text-2); }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.sub { font-size: .8125rem; color: var(--text-2); }
.na { color: var(--muted); font-weight: 500; }
.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
.notice { background: var(--warning-light); color: var(--text); border-radius: var(--r-md); padding: 10px 14px; font-size: .9375rem; display: flex; gap: 8px; align-items: baseline; }

.top { display: flex; flex-direction: column; gap: 2px; padding: 4px 2px 8px; }

.top .meta .ic { width: 15px; height: 15px; color: var(--warning); }
.top h1 { font-size: 2.25rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }

.call { display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; align-items: center; }
.gauge { width: 112px; height: 100px; position: relative; }
.gauge svg { width: 100%; height: 100%; overflow: visible; }
.gauge .lvw { position: absolute; inset: 28px 0 0; text-align: center; }

.gauge .lvw b.long { font-size: 1.05rem; }
.gauge .lvw span { font-size: .6875rem; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; }

.sig .v { font-size: 1.125rem; font-weight: 700; }
.sig .v small { font-size: .75rem; font-weight: 500; color: var(--text-2); margin-left: 2px; }
.sig .d { font-size: .75rem; font-weight: 600; color: var(--text-2); }
.sig .d.down { color: var(--danger); } .sig .d.good { color: var(--success); }

.tl { width: 100%; height: auto; display: block; overflow: visible; }
.tl text { font: 500 10px var(--font); fill: var(--text-2); }
.tl .t-temp { font-weight: 700; font-size: 10.5px; fill: var(--text); }
.tl .night { fill: var(--night); }
.tl .lane { fill: var(--raised); }
.tl .cal { fill: var(--cal); }

.tl-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .75rem; color: var(--text-2); margin-top: 6px; }
.tl-key span::before { content: ""; display: inline-block; width: 12px; height: 9px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: -1px; }
.tl-key span.dash::before { background: none; border: 1.5px dashed var(--success); width: 9px; height: 6px; }
.tl-notes { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; font-size: .875rem; }
.tl-notes div { display: flex; gap: 8px; align-items: baseline; }
.tl-notes .ic { width: 15px; height: 15px; position: relative; top: 2px; color: var(--text-2); }
.tl-notes b { font-weight: 600; }
.tl-notes .flag .ic, .tl-notes .flag b { color: var(--danger); }
.due { margin: -4px 0 10px; }
.due .item:first-child { border-top: 0; padding-top: 0; }
.due .item > .ic { width: 18px; height: 18px; }
.due .more { margin-top: 2px; }

.sleep-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.big { font-size: 2.25rem; font-weight: 700; line-height: 1; }
.big small { font-size: 1rem; font-weight: 600; color: var(--text-2); margin: 0 4px 0 1px; }
.score { text-align: right; }
.score b { font-size: 1.75rem; font-weight: 700; line-height: 1; display: block; }
.stages { display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px; margin: 14px 0 6px; }
.stages i { display: block; height: 100%; }
.st-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8125rem; color: var(--text-2); }
.st-legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--c); margin-right: 5px; }
.st-legend b { color: var(--text); font-weight: 600; margin-left: 3px; }
.mt { display: flex; flex-direction: column; gap: 6px; }
.mt .k { display: flex; align-items: center; gap: 6px; font-size: .875rem; font-weight: 600; }
.mt .k .ic { color: var(--c); }
.mt .val { font-size: 1.75rem; font-weight: 700; line-height: 1.1; }
.mt .val small { font-size: .875rem; color: var(--text-2); font-weight: 500; margin-left: 3px; }
.mt .val.na { font-size: 1.125rem; }
.spark { width: 100%; height: 40px; display: block; overflow: visible; }
.range { position: relative; height: 18px; margin-top: 2px; }
.range .track { position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 2px; background: var(--border-light); }
.range .avg { position: absolute; top: 3px; width: 2px; height: 12px; background: var(--text-2); border-radius: 1px; }
.range .me { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--c); border: 2px solid var(--surface); }

.sess { display: flex; flex-direction: column; gap: 4px; padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--border-light); }
.sess:first-of-type { padding-top: 0; margin-top: 0; border-top: 0; }
.act { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; }
.act h3 { font-size: 1.0625rem; font-weight: 700; }
.act .fig { font-size: 1.75rem; font-weight: 700; line-height: 1; text-align: right; }
.act .fig small { font-size: .875rem; color: var(--text-2); font-weight: 500; margin-left: 2px; }
.tags { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.eff { display: inline-flex; align-items: center; gap: 5px; font-size: .8125rem; font-weight: 600; color: var(--ec); }
.eff::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ec); }
.quote { margin-top: 8px; padding: 10px 12px; border-radius: var(--r-md); background: var(--raised); font-size: .9375rem; }
.quote .sub { display: block; margin-bottom: 2px; }
.drinks { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; margin-top: 12px; }
.dk { background: var(--raised); border-radius: var(--r-md); padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dk.water { grid-column: span 2; }
.dk .k { display: flex; align-items: center; gap: 5px; font-size: .75rem; color: var(--text-2); }
.dk .k .ic { width: 14px; height: 14px; color: var(--c); }
.dk .v { font-size: 1.25rem; font-weight: 700; line-height: 1.2; }
.dk .v small { font-size: .75rem; font-weight: 500; color: var(--text-2); margin-left: 2px; }
.dk .v.na { font-size: .8125rem; padding-top: 4px; }
.dk .bar { height: 4px; border-radius: 2px; background: var(--border-light); overflow: hidden; margin-top: 3px; }
.dk .bar i { display: block; height: 100%; background: var(--water); border-radius: 2px; }

.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 92px; }
.bars .b { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 3px; }
.bars .b span { font-size: .6875rem; color: var(--text-2); }
.bars .b i { display: block; width: 100%; max-width: 28px; border-radius: 6px 6px 3px 3px; background: var(--ec); min-height: 4px; }
.bars-x { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: .75rem; color: var(--text-2); margin-top: 6px; }
.bars-x b { display: block; color: var(--text); font-weight: 600; }
.key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .75rem; color: var(--text-2); margin-top: 10px; }
.key span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ec); margin-right: 5px; }

.ahead { display: grid; grid-template-columns: 1fr; gap: 10px; }
.dc { background: var(--raised); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.dc .dt span { display: block; font-size: .6875rem; font-weight: 600; color: var(--text-2); text-transform: uppercase; }

.dc .wx .ic { width: 26px; height: 26px; color: var(--warning); }
.dc .wx b { color: var(--text); font-size: .9375rem; }
.dc .wx .flag { color: var(--danger); font-weight: 600; }
.dc .ln { display: flex; align-items: baseline; gap: 8px; font-size: .875rem; flex-wrap: wrap; }
.dc .ln .t { color: var(--text-2); font-size: .75rem; min-width: 66px; flex: none; }
.dc .last { font-size: .8125rem; color: var(--text-2); border-left: 2px solid var(--border); padding-left: 8px; }
.dc .none { font-size: .8125rem; color: var(--muted); }

.lbl { font-size: .6875rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); margin: 10px 0 2px; }

.item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border-light); font-size: .9375rem; }

.item .tag { margin-left: auto; font-size: .6875rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
.item .tag.late { color: var(--danger); border-color: var(--danger); border-style: dashed; }
.bp { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: baseline; margin-top: 10px; font-size: .875rem; }
.bp b { font-size: 1.125rem; }
.foot { font-size: .8125rem; color: var(--muted); padding: 4px 2px; }

@media (min-width: 720px) {
  .wrap { gap: 14px; }
  .gauge { width: 132px; height: 116px; }
  .gauge .lvw { inset: 34px 0 0; }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .signals { grid-template-columns: repeat(4, 1fr); }
  .ahead { grid-template-columns: repeat(3, 1fr); }
}
/* Nightly brief (#829): the night palette is the lead card's, the same in light and dark. */
:root { --nt-bg: #1a2140; --nt-bg2: #232c54; --nt-text: #eef1ff; --nt-dim: #a9b2d8; --nt-accent: #ffd479; --nt-bed: #8fa8ff; --nt-ghost: #5b6696; --nt-line: #3a4572; --bed: #6d4fd6; }
:root[data-theme="dark"] { --bed: #b9a3ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bed: #b9a3ff; } }
a.lk { color: inherit; text-decoration: none; display: block; }
a.lk:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--r-md); }
.lead { background: var(--nt-bg); color: var(--nt-text); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.lead .eyebrow { display: flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--nt-accent); }
.lead .eyebrow .ic { width: 16px; height: 16px; }
.lead .row { display: grid; grid-template-columns: 1fr; gap: 12px; }
.lead .k { font-size: .8125rem; color: var(--nt-dim); }

.lead .bedby.small { font-size: 1.125rem; font-weight: 600; }
.lead .upat { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.lead .upat b { font-size: 1.375rem; font-weight: 700; }
.lead .chip-type { background: color-mix(in srgb, var(--tc) 28%, var(--nt-bg2)); color: var(--nt-text); }
.lead .why { font-size: .9375rem; color: var(--nt-text); }

.mv b { font-size: 1rem; font-weight: 700; }

.tile .v { font-size: 1.375rem; font-weight: 700; line-height: 1.2; }

.tile .v.na { font-size: .9375rem; color: var(--muted); font-weight: 500; padding: 4px 0; }

.dot-w { fill: var(--water); } .dot-c { fill: var(--coffee); }

      cards.forEach(function (f) {
        var kids = [];
        if (f.moved) kids.push(el("div", "new", f.moved));
        var chipEl = el("span", "gchip", f.chip);
        chipEl.style.setProperty("--gc", f.hand ? "var(--text-2)" : (GC[f.grade] || "var(--text-2)"));
        kids.push(chipEl, el("h3", null, f.title));
        if (f.lead) kids.push(el("p", "lead-line", f.lead));
        var cmp = el("div", "cmp");
        (f.bars || []).forEach(function (b) {
          var top = Math.max(Math.abs(b.a), Math.abs(b.b), 1e-9);
          function row(name, v, col) {
            var bar = el("div", "cb", [el("i")]);
            bar.firstChild.style.width = Math.max(2, Math.abs(v) / top * 100) + "%";
            var r = el("div", "cr", [el("span", null, name), bar, el("b", "num", String(v) + (b.unit ? " " + b.unit : ""))]);
            r.style.setProperty("--c", col);
            return r;
          }
          cmp.appendChild(el("div", "cm", [el("div", "cmh", b.label), row(f.a_label, b.a, "var(--primary)"), row(f.b_label, b.b, "var(--muted)")]));
        });
        if (cmp.childNodes.length) kids.push(cmp);
        if (f.so) kids.push(el("p", "so", [el("b", null, "So: "), f.so]));
        kids.push(el("p", "from", "From your own data, not a clinical finding."));
        c.appendChild(el("article", "fc", kids));
      });
      root.appendChild(c);
    }
    var pr = F.progress || [];
    if (pr.length) {
      var p = card("Tests in progress", "clock");
      pr.forEach(function (t) {
        if (t.kind === "blocked") { p.appendChild(el("div", "pg", [el("div", "pgh", [el("b", null, t.title)]), el("div", "wait", t.text)])); return; }
        var m = el("div", "meter", [el("i")]);
        m.firstChild.style.width = Math.round(Math.max(0, Math.min(1, t.fraction || 0)) * 100) + "%";
        p.appendChild(el("div", "pg", [el("div", "pgh", [el("b", null, t.title), el("span", "num", t.text)]), m]));
      });
      root.appendChild(p);
    }
  })();

  // ---- Try this / Trial (#831): one card. The answer is saved through the db capability, owner-only.
  (function () {
    var T = D.trial;
    if (!T) return;
    var GC = { Worked: "var(--success)", "Didn't work": "var(--text-2)", "Not enough days": "var(--warning)" };
    var c = card(T.state === "proposed" || T.state === "accepted" ? "Try this" : "Trial", "finding", T.state === "proposed" ? T.period + " days" : null);
    var body = el("div", "tr");
    c.appendChild(body);
    root.appendChild(c);
    var v = { db: null, ready: false, owner: true, row: null, endRow: null, busy: null, err: false, ending: false, value: T.value };
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function show(kind, x, unit) {
      if (kind === "time") { var m = ((x % 1440) + 1440) % 1440, h = Math.floor(m / 60); return (h % 12 || 12) + ":" + pad(m % 60) + " " + (h >= 12 ? "PM" : "AM"); }
      return x + (unit ? " " + unit : "");
    }
    function rowVal(kind, x) { if (kind === "time") { var m = ((x % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ":" + pad(m % 60); } return x; }
    function fromRow(kind, raw) { if (kind === "time") { var p = String(raw).split(":"), m = +p[0] * 60 + +p[1]; return m < 720 ? m + 1440 : m; } return +raw; }
    function chip(text, col) { var e = el("span", "gchip", text); e.style.setProperty("--gc", col || "var(--primary)"); return e; }
    function head(label, right) { return el("div", "trh", [el("span", "sub", label), right]); }
    function when(iso) { try { return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; } }
    function change() { return T.changeT.replace("{target}", show(T.kind, v.value, T.unit)); }
    function save(decision) {
      if (v.busy) return;
      v.busy = decision; v.err = false; draw();
      var doc = { decision: decision, target: rowVal(T.kind, v.value), decided_at: new Date().toISOString(), slug: T.slug };
      v.db.doc("trials/" + T.id).set(doc).then(function () { v.busy = null; v.row = doc; draw(); },
        function () { v.busy = null; v.err = true; draw(); });
    }
    function endTrial() {
      if (v.busy) return;
      v.busy = "end"; v.err = false; draw();
      var doc = { decision: "end", target: T.target, decided_at: new Date().toISOString(), slug: T.slug };
      v.db.doc("trials/" + T.endId).set(doc).then(function () { v.busy = null; v.ending = false; v.endRow = doc; draw(); },
        function () { v.busy = null; v.err = true; draw(); });
    }
    function btn(text, cls, fn, disabled) {
      var b = el("button", cls, text);
      b.type = "button";
      b.disabled = !!disabled;
      b.addEventListener("click", fn);
      return b;
    }
    function canAnswer() { return !!(v.db && v.owner); }
    function noDb() { return v.ready && !canAnswer() ? el("p", "note", "Open this page in Claude to answer.") : null; }
    function draw() {
      body.textContent = "";
      var kids = [];
      if (T.state === "proposed") {
        if (v.row && v.row.decision === "not_now") { kids.push(el("p", null, "Not now. It won't come back for 4 weeks.")); }
        else if (v.row && v.row.decision === "never") { kids.push(el("p", null, "Won't suggest this again.")); }
        else if (v.row && v.row.decision === "accept") {
          var tv = fromRow(T.kind, v.row.target);
          kids.push(head(T.period + " days", chip("Accepted")), el("h3", null, T.changeT.replace("{target}", show(T.kind, tv, T.unit))),
            el("p", null, "Accepted at " + when(v.row.decided_at) + ". Tomorrow night's brief records it and starts the count."));
        } else {
          kids.push(head("Proposed", chip(T.chip, T.grade === "strong" ? "var(--success)" : T.grade === "leaning" ? "var(--warning)" : "var(--text-2)")),
            el("h3", null, change()),
            el("p", null, [el("span", "k", "Why: "), T.why]),
            el("p", null, [el("span", "k", "Measured by: "), T.measured]),
            el("p", null, [el("span", "k", "Counts as working if: "), T.success]));
          var step = T.step;
          var minus = btn("\u2212", null, function () { v.value = Math.max(T.lo, v.value - step); draw(); }, v.busy || v.value - step < T.lo);
          var plus = btn("+", null, function () { v.value = Math.min(T.hi, v.value + step); draw(); }, v.busy || v.value + step > T.hi);
          minus.setAttribute("aria-label", "Lower the target"); plus.setAttribute("aria-label", "Raise the target");
          kids.push(el("div", "stp", [el("span", "k", "Target"), minus, el("b", "num", show(T.kind, v.value, T.unit)), plus,
            el("span", "rng", show(T.kind, T.lo, T.unit) + " to " + show(T.kind, T.hi, T.unit))]));
          if (canAnswer()) {
            var off = !!v.busy;
            kids.push(el("div", "btns", [
              btn(v.busy === "accept" ? "Saving\u2026" : "Accept", "primary", function () { save("accept"); }, off),
              btn(v.busy === "not_now" ? "Saving\u2026" : "Not now", null, function () { save("not_now"); }, off),
              btn(v.busy === "never" ? "Saving\u2026" : "Don't suggest again", null, function () { save("never"); }, off)]));
            if (v.err) kids.push(el("p", "err", "Couldn't save. Try again."));
          } else kids.push(noDb());
        }
      } else if (T.state === "accepted") {
        kids.push(head(T.period + " days", chip(T.waits ? "Waiting" : "Starts " + T.start)), el("h3", null, T.change),
          el("p", null, T.waits ? "Your wiki couldn't be updated tonight, so this starts once it can." : "Recorded in your wiki. The count starts " + T.start + "."));
      } else if (T.state === "running") {
        kids.push(head("Day " + T.day + " of " + T.of, chip("Running")), el("h3", null, T.change), el("p", null, T.line));
        if (v.endRow) kids.push(el("p", null, "Ending. Tomorrow's brief writes the readout."));
        else if (v.ending) {
          kids.push(el("p", null, "End this trial now? Its readout will use the " + T.day + " days so far."),
            el("div", "btns", [btn(v.busy ? "Saving\u2026" : "End trial", "danger", endTrial, !!v.busy), btn("Keep going", null, function () { v.ending = false; v.err = false; draw(); }, !!v.busy)]));
          if (v.err) kids.push(el("p", "err", "Couldn't save. Try again."));
        } else if (canAnswer()) kids.push(el("div", "btns", [btn("End trial", null, function () { v.ending = true; draw(); })]));
        else kids.push(noDb());
      } else if (T.state === "ended") {
        var r = T.result.charAt(0).toUpperCase() + T.result.slice(1);
        kids.push(head(T.end, chip(r, GC[r])), el("h3", null, T.change), el("p", null, T.line),
          el("p", "note", T.pending ? "Your wiki couldn't be updated tonight, so the readout waits." : "The readout is in your wiki."));
      }
      kids.forEach(function (k) { if (k) body.appendChild(k); });
    }
    draw();
    // the answers are read once and kept; a missing database leaves the card readable with no buttons
    var waits;
    try { waits = [claude.use("db"), claude.use("user")]; } catch (e) { waits = [Promise.resolve(null), Promise.resolve(null)]; }
    var timer = new Promise(function (res) { setTimeout(function () { res("timeout"); }, 10000); });
    Promise.race([Promise.all(waits), timer]).then(function (got) {
      if (got !== "timeout" && got && got[0]) {
        v.db = got[0];
        if (got[1] && typeof got[1].isOwner === "function") v.owner = !!got[1].isOwner();
        if (T.state === "proposed") v.db.doc("trials/" + T.id).onSnapshot(function (s) { if (!v.busy && s.exists) { v.row = s.data(); draw(); } }, function () {});
        if (T.state === "running") v.db.doc("trials/" + T.endId).onSnapshot(function (s) { if (!v.busy && s.exists) { v.endRow = s.data(); draw(); } }, function () {});
      }
      v.ready = true;
      draw();
    }, function () { v.ready = true; draw(); });
  })();

  // ---- Next 5 days
  (function () {
    var N = D.next;
    if (!N) return;
    var c = card("Next 5 days", "ahead", N.aside);
    var top = el("div", "grid");
    top.style.marginBottom = "10px";
    if (N.overdue) top.appendChild(box("div", "dueline", N.overdue.href, [N.overdue.text]));
    if (N.dinners) top.appendChild(box("div", "dinline", N.dinners.href, [N.dinners.text]));
    if (top.childNodes.length) c.appendChild(top);
    // the strips sit inside each day's 12px padding; the hours are drawn on the same scale so they line up
    var NW = CW - 24, X = function (v) { return 4 + (Math.max(5, Math.min(23, v)) - 5) * (NW - 8) / 18; };
    var ax = svg("0 0 " + CW + " 14", "tl", null);
    ax.innerHTML = [5, 9, 13, 17, 21].map(function (t) { return '<text x="' + (12 + X(t)).toFixed(1) + '" y="11" text-anchor="middle">' + fmtH(t) + '</text>'; }).join("");
    c.appendChild(ax);
    var list = el("div", "ahead");
    list.style.gridTemplateColumns = "1fr";
    (N.days || []).forEach(function (d) {
      var kids = [];
      var wx = d.wx ? el("div", "wx", [icon(d.wx.ic), el("span", null, [el("b", "num", d.wx.hi + "°"), " / " + d.wx.lo + "° · wind " + d.wx.wind + " · rain " + d.wx.rain + "%"]), d.wx.flag ? el("span", "flag", d.wx.flag) : null]) : null;
      kids.push(el("div", "hd", [el("div", "dt", [el("span", null, d.dow), el("b", "num", d.n)]), wx]));
      var st = svg("0 0 " + NW + " 22", "nstrip", d.dow + " " + d.n + " on the time axis");
      var h = '<rect class="nn" x="4" y="2" width="' + (X(7) - 4).toFixed(1) + '" height="18" rx="4"/><rect class="nn" x="' + X(21).toFixed(1) + '" y="2" width="' + (NW - 4 - X(21)).toFixed(1) + '" height="18" rx="4"/>';
      (d.events || []).forEach(function (e) { if (e.s != null) h += '<rect class="ev" x="' + X(e.s).toFixed(1) + '" y="4" width="' + Math.max(3, X(e.e) - X(e.s)).toFixed(1) + '" height="14" rx="3"/>'; });
      (d.plans || []).forEach(function (p) { if (p.s != null) h += '<rect x="' + X(p.s).toFixed(1) + '" y="4" width="' + Math.max(4, X(p.e) - X(p.s)).toFixed(1) + '" height="14" rx="3" style="fill:' + (TCOL[String(p.type).split(":")[0]] || "var(--primary)") + '"/>'; });
      st.innerHTML = h;
      kids.push(st);
      (d.plans || []).forEach(function (p) { kids.push(el("div", "ln", [typeChip(p.type, p.title), p.sub ? el("span", "sub", p.sub) : null])); });
      (d.events || []).forEach(function (e) { kids.push(el("div", "ln", [el("span", "t", e.t || ""), el("span", null, e.title)])); });
      (d.allday || []).forEach(function (t) { kids.push(el("div", "ln", [el("span", "t", "All day"), el("span", null, t)])); });
      (d.board || []).forEach(function (b) { kids.push(box("div", "ln", b.href, [el("span", "t", "Hive due"), el("span", null, b.title)])); });
      if (d.why) kids.push(el("div", "why", d.why));
      if (d.bed) kids.push(el("div", "bedln", [icon("moon"), "Bed by " + d.bed.time, el("span", null, d.bed.why)]));
      if (d.outlook) kids.push(el("div", "outlook", [icon("outlook"), d.outlook]));
      list.appendChild(box("div", "nd", d.href, kids));
    });
    c.appendChild(list);
    root.appendChild(c);
  })();

  if (D.foot) root.appendChild(el("p", "foot", D.foot));
})();
</script>
