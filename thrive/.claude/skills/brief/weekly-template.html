<title>Weekly Brief</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column on a phone, the week ahead first. The plan and what to change in it, then each day as a
   6 AM to 10 PM bar (night shaded, calendar and sessions labelled), then last week against the week before
   (stats, a two-week log, recovery), body beside board. Tokens are Thrive's own, copied so the page stands alone. */
:root {
  --bg: #f0f2f5; --surface: #ffffff; --raised: #f5f6f8; --border: #dadce0; --border-light: #e8eaed;
  --text: #1f1f1f; --text-2: #5f6368; --muted: #606b76;
  --primary: #2f66f0; --success: #2e7d32; --warning: #a05d00; --warning-light: #fff8e1; --danger: #b71c1c;
  --heart: #c2185b; --hrv: #00796b; --sleep: #7c3aed; --deep: #1e3a8a; --rem: #7c3aed; --light: #5b8def; --awake: #8a6d00;
  --water: #0b6fb8; --coffee: #6f4e37; --alcohol: #b45309; --unwind: #5e7c62;
  --t-weight: #c53030; --t-stretch: #2e7d32; --t-bike: #1565c0; --t-hike: #5d4037; --t-run: #9d174d; --t-walk: #10605a;
  --e-easy: #2e7d32; --e-medium: #a05d00; --e-hard: #c62828; --e-none: #b9c0c8;
  --lv-rest: #4f6f8f; --lv-easy: #2e7d32; --lv-plan: #a05d00; --lv-push: #c62828;
  --night: rgba(30, 40, 70, .09); --cal: #c3d2ee; --cal-text: #1d2b48; --strip-track: #e9ecf1; --strip-night: #cfd4dc;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  --r-lg: 16px; --r-md: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --surface: #1a1a1e; --raised: #252528; --border: #3c3c3c; --border-light: #2c2c31;
    --text: #e8eaed; --text-2: #9aa0a6; --muted: #868e98;
    --primary: #6e97ff; --success: #66bb6a; --warning: #ffb74d; --warning-light: #2d2210; --danger: #f26b68;
    --heart: #f47a95; --hrv: #4fd1c5; --sleep: #b9a3ff; --deep: #5470d0; --rem: #b9a3ff; --light: #4f86f7; --awake: #f2c94c;
    --water: #5bb8f5; --coffee: #c9a27e; --alcohol: #f5a524; --unwind: #9cbf9f;
    --t-weight: #fca5a5; --t-stretch: #86efac; --t-bike: #93c5fd; --t-hike: #d7ccc8; --t-run: #f5a8d3; --t-walk: #7fded3;
    --e-easy: #86efac; --e-medium: #ffb74d; --e-hard: #ef9a9a; --e-none: #3c3c42;
    --lv-rest: #8fb0d0; --lv-easy: #86efac; --lv-plan: #ffb74d; --lv-push: #ef9a9a;
    --night: rgba(0, 0, 0, .4); --cal: #4a5f8f; --cal-text: #eef2fb; --strip-track: #2c2c31; --strip-night: #18181b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --surface: #1a1a1e; --raised: #252528; --border: #3c3c3c; --border-light: #2c2c31;
  --text: #e8eaed; --text-2: #9aa0a6; --muted: #868e98;
  --primary: #6e97ff; --success: #66bb6a; --warning: #ffb74d; --warning-light: #2d2210; --danger: #f26b68;
  --heart: #f47a95; --hrv: #4fd1c5; --sleep: #b9a3ff; --deep: #5470d0; --rem: #b9a3ff; --light: #4f86f7; --awake: #f2c94c;
  --water: #5bb8f5; --coffee: #c9a27e; --alcohol: #f5a524; --unwind: #9cbf9f;
  --t-weight: #fca5a5; --t-stretch: #86efac; --t-bike: #93c5fd; --t-hike: #d7ccc8; --t-run: #f5a8d3; --t-walk: #7fded3;
  --e-easy: #86efac; --e-medium: #ffb74d; --e-hard: #ef9a9a; --e-none: #3c3c42;
  --lv-rest: #8fb0d0; --lv-easy: #86efac; --lv-plan: #ffb74d; --lv-push: #ef9a9a;
  --night: rgba(0, 0, 0, .4); --cal: #4a5f8f; --cal-text: #eef2fb; --strip-track: #2c2c31; --strip-night: #18181b;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 960px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.num { font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border-radius: var(--r-lg); padding: 16px; min-width: 0; }
.ch { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; margin-bottom: 12px; }
.ch h2 { font-size: 1rem; font-weight: 600; white-space: nowrap; }
.ch .aside { font-size: .8125rem; color: var(--text-2); }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.sub { font-size: .8125rem; color: var(--text-2); }
.na { color: var(--muted); font-weight: 500; }
.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
.notice { background: var(--warning-light); color: var(--text); border-radius: var(--r-md); padding: 10px 14px; font-size: .9375rem; display: flex; gap: 8px; align-items: baseline; }
.notice .ic { color: var(--warning); width: 16px; height: 16px; position: relative; top: 3px; }

.top { display: flex; flex-direction: column; gap: 2px; padding: 4px 2px 8px; }
.top .meta { display: flex; align-items: center; gap: 8px; font-size: .875rem; color: var(--text-2); flex-wrap: wrap; }
.top .meta .ic { width: 15px; height: 15px; color: var(--warning); }
.top h1 { font-size: 2.25rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }

.call { display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; align-items: center; }
.gauge { width: 112px; height: 100px; position: relative; }
.gauge svg { width: 100%; height: 100%; overflow: visible; }
.gauge .lvw { position: absolute; inset: 28px 0 0; text-align: center; }
.gauge .lvw b { display: block; font-size: 1.6rem; font-weight: 800; line-height: 1.1; color: var(--lvl); }
.gauge .lvw b.long { font-size: 1.05rem; }
.gauge .lvw span { font-size: .6875rem; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; }
.what { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.what .when { font-size: .8125rem; color: var(--text-2); }
.what h3 { font-size: 1.375rem; font-weight: 700; line-height: 1.25; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.call .why { grid-column: 1 / -1; font-size: .9375rem; }
.chip-type { display: inline-flex; align-items: center; gap: 5px; font-size: .75rem; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 999px; color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, transparent); white-space: nowrap; }
.chip-type .ic { width: 14px; height: 14px; }
.signals { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.sig { background: var(--raised); border-radius: var(--r-md); padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; border: 1px solid transparent; }
.sig.down { border-color: color-mix(in srgb, var(--e-hard) 55%, transparent); }
.sig .k { font-size: .75rem; color: var(--text-2); display: flex; align-items: center; gap: 5px; }
.sig .k .ic { width: 13px; height: 13px; color: var(--c); }
.sig .v { font-size: 1.125rem; font-weight: 700; }
.sig .v small { font-size: .75rem; font-weight: 500; color: var(--text-2); margin-left: 2px; }
.sig .d { font-size: .75rem; font-weight: 600; color: var(--text-2); }
.sig .d.down { color: var(--danger); } .sig .d.good { color: var(--success); }

.tl { width: 100%; height: auto; display: block; overflow: visible; }
.tl text { font: 500 10px var(--font); fill: var(--text-2); }
.tl .t-temp { font-weight: 700; font-size: 10.5px; fill: var(--text); }
.tl .night { fill: var(--night); }
.tl .lane { fill: var(--raised); }
.tl .cal { fill: var(--cal); }
.tl .cal-t { fill: var(--cal-text); font-weight: 600; }
.tl .mk { stroke: var(--text-2); stroke-width: 1.2; stroke-dasharray: 2 2; }
.tl .mk-t { font-size: 9.5px; font-weight: 600; fill: var(--text); }
.tl .best { fill: none; stroke: var(--success); stroke-width: 1.5; stroke-dasharray: 4 3; }
.tl-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .75rem; color: var(--text-2); margin-top: 6px; }
.tl-key span::before { content: ""; display: inline-block; width: 12px; height: 9px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: -1px; }
.tl-key span.dash::before { background: none; border: 1.5px dashed var(--success); width: 9px; height: 6px; }
.tl-notes { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; font-size: .875rem; }
.tl-notes div { display: flex; gap: 8px; align-items: baseline; }
.tl-notes .ic { width: 15px; height: 15px; position: relative; top: 2px; color: var(--text-2); }
.tl-notes b { font-weight: 600; }
.tl-notes .flag .ic, .tl-notes .flag b { color: var(--danger); }

.sleep-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.big { font-size: 2.25rem; font-weight: 700; line-height: 1; }
.big small { font-size: 1rem; font-weight: 600; color: var(--text-2); margin: 0 4px 0 1px; }
.score { text-align: right; }
.score b { font-size: 1.75rem; font-weight: 700; line-height: 1; display: block; }
.stages { display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px; margin: 14px 0 6px; }
.stages i { display: block; height: 100%; }
.st-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8125rem; color: var(--text-2); }
.st-legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--c); margin-right: 5px; }
.st-legend b { color: var(--text); font-weight: 600; margin-left: 3px; }
.mt { display: flex; flex-direction: column; gap: 6px; }
.mt .k { display: flex; align-items: center; gap: 6px; font-size: .875rem; font-weight: 600; }
.mt .k .ic { color: var(--c); }
.mt .val { font-size: 1.75rem; font-weight: 700; line-height: 1.1; }
.mt .val small { font-size: .875rem; color: var(--text-2); font-weight: 500; margin-left: 3px; }
.mt .val.na { font-size: 1.125rem; }
.spark { width: 100%; height: 40px; display: block; overflow: visible; }
.range { position: relative; height: 18px; margin-top: 2px; }
.range .track { position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 2px; background: var(--border-light); }
.range .avg { position: absolute; top: 3px; width: 2px; height: 12px; background: var(--text-2); border-radius: 1px; }
.range .me { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--c); border: 2px solid var(--surface); }

.sess { display: flex; flex-direction: column; gap: 4px; padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--border-light); }
.sess:first-of-type { padding-top: 0; margin-top: 0; border-top: 0; }
.act { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; }
.act h3 { font-size: 1.0625rem; font-weight: 700; }
.act .fig { font-size: 1.75rem; font-weight: 700; line-height: 1; text-align: right; }
.act .fig small { font-size: .875rem; color: var(--text-2); font-weight: 500; margin-left: 2px; }
.tags { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.eff { display: inline-flex; align-items: center; gap: 5px; font-size: .8125rem; font-weight: 600; color: var(--ec); }
.eff::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ec); }
.quote { margin-top: 8px; padding: 10px 12px; border-radius: var(--r-md); background: var(--raised); font-size: .9375rem; }
.quote .sub { display: block; margin-bottom: 2px; }
.drinks { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; margin-top: 12px; }
.dk { background: var(--raised); border-radius: var(--r-md); padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dk.water { grid-column: span 2; }
.dk .k { display: flex; align-items: center; gap: 5px; font-size: .75rem; color: var(--text-2); }
.dk .k .ic { width: 14px; height: 14px; color: var(--c); }
.dk .v { font-size: 1.25rem; font-weight: 700; line-height: 1.2; }
.dk .v small { font-size: .75rem; font-weight: 500; color: var(--text-2); margin-left: 2px; }
.dk .v.na { font-size: .8125rem; padding-top: 4px; }
.dk .bar { height: 4px; border-radius: 2px; background: var(--border-light); overflow: hidden; margin-top: 3px; }
.dk .bar i { display: block; height: 100%; background: var(--water); border-radius: 2px; }

.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 92px; }
.bars .b { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 3px; }
.bars .b span { font-size: .6875rem; color: var(--text-2); }
.bars .b i { display: block; width: 100%; max-width: 28px; border-radius: 6px 6px 3px 3px; background: var(--ec); min-height: 4px; }
.bars-x { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: .75rem; color: var(--text-2); margin-top: 6px; }
.bars-x b { display: block; color: var(--text); font-weight: 600; }
.key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .75rem; color: var(--text-2); margin-top: 10px; }
.key span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ec); margin-right: 5px; }

.ahead { display: grid; grid-template-columns: 1fr; gap: 10px; }
.dc { background: var(--raised); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.dc .hd { display: flex; align-items: center; gap: 10px; }
.dc .dt { width: 40px; text-align: center; flex: none; }
.dc .dt span { display: block; font-size: .6875rem; font-weight: 600; color: var(--text-2); text-transform: uppercase; }
.dc .dt b { font-size: 1.25rem; font-weight: 700; line-height: 1.1; }
.dc .wx { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: .8125rem; color: var(--text-2); }
.dc .wx .ic { width: 26px; height: 26px; color: var(--warning); }
.dc .wx b { color: var(--text); font-size: .9375rem; }
.dc .wx .flag { color: var(--danger); font-weight: 600; }
.dc .ln { display: flex; align-items: baseline; gap: 8px; font-size: .875rem; flex-wrap: wrap; }
.dc .ln .t { color: var(--text-2); font-size: .75rem; min-width: 66px; flex: none; }
.dc .last { font-size: .8125rem; color: var(--text-2); border-left: 2px solid var(--border); padding-left: 8px; }
.dc .none { font-size: .8125rem; color: var(--muted); }

.lbl { font-size: .6875rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); margin: 10px 0 2px; }
.lbl:first-of-type { margin-top: 0; }
.item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border-light); font-size: .9375rem; }
.lbl + .item { border-top: 0; }
.item .bd { font-size: .75rem; color: var(--text-2); }
.item .tag { margin-left: auto; font-size: .6875rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
.item .tag.late { color: var(--danger); border-color: var(--danger); border-style: dashed; }
.bp { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: baseline; margin-top: 10px; font-size: .875rem; }
.bp b { font-size: 1.125rem; }
.foot { font-size: .8125rem; color: var(--muted); padding: 4px 2px; }

@media (min-width: 720px) {
  .wrap { gap: 14px; }
  .gauge { width: 132px; height: 116px; }
  .gauge .lvw { inset: 34px 0 0; }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .signals { grid-template-columns: repeat(4, 1fr); }
  .ahead { grid-template-columns: repeat(3, 1fr); }
}
/* Weekly */
.plan-sum { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.sug { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--border-light); }
.sug:first-of-type { border-top: 0; padding-top: 0; }
.kind { grid-row: span 2; align-self: start; font-size: .6875rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 0; width: 52px; text-align: center; border-radius: 6px; color: var(--kc); background: color-mix(in srgb, var(--kc) 16%, transparent); }
.sug b { font-weight: 600; }
.sug .sub { font-size: .875rem; }
.week { display: flex; flex-direction: column; }
.wd { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border-light); }
.wd:first-child { border-top: 0; padding-top: 0; }
.wd .dt { text-align: center; padding-top: 2px; }
.wd .dt span { display: block; font-size: .6875rem; font-weight: 600; color: var(--text-2); text-transform: uppercase; }
.wd .dt b { font-size: 1.25rem; font-weight: 700; line-height: 1.1; }
.wd .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.wd .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.wd .wx { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: .8125rem; color: var(--text-2); white-space: nowrap; }
.wd .wx .ic { width: 20px; height: 20px; color: var(--warning); }
.wd .wx b { color: var(--text); }
.wd .wx .flag { color: var(--danger); font-weight: 600; }
.strip { width: 100%; height: 30px; display: block; overflow: visible; }
.strip text { font: 600 10px var(--font); }
.axis { display: grid; grid-template-columns: 44px 1fr; gap: 10px; margin-bottom: 6px; }
.axis svg { width: 100%; height: 12px; display: block; overflow: visible; }
.axis text { font: 500 10px var(--font); fill: var(--text-2); }
@media (min-width: 720px) { .axis { grid-template-columns: 52px 1fr; } }
.wd .evs { font-size: .8125rem; color: var(--text-2); }
.wd .evs.hive { display: flex; align-items: center; gap: 6px; }
.wd .evs.hive .ic { width: 14px; height: 14px; }
.overdue { display: flex; align-items: center; gap: 8px; font-size: .875rem; margin-bottom: 12px; padding: 8px 10px; border-radius: var(--r-md); border: 1px dashed var(--danger); }
.overdue .ic { width: 18px; height: 18px; }
.overdue b { color: var(--danger); font-weight: 700; white-space: nowrap; }
.overdue span { color: var(--text-2); min-width: 0; }
.wd .sg { display: inline-flex; align-items: center; gap: 6px; font-size: .8125rem; font-weight: 600; color: var(--kc); }
.wd .sg i { font-style: normal; font-size: .625rem; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: color-mix(in srgb, var(--kc) 16%, transparent); }
.struck { text-decoration: line-through; opacity: .55; }
.lgd { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .75rem; color: var(--text-2); margin-top: 10px; }
.lgd span::before { content: ""; display: inline-block; width: 12px; height: 9px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: -1px; }
.lgd span:last-child::before { border: 1.5px dashed var(--text-2); width: 9px; height: 6px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .k { font-size: .8125rem; color: var(--text-2); }
.stat .v { font-size: 1.625rem; font-weight: 700; line-height: 1.15; }
.stat .v small { font-size: .8125rem; color: var(--text-2); font-weight: 500; margin-left: 2px; }
.stat .d { font-size: .75rem; font-weight: 600; color: var(--text-2); }
.stat .d.up { color: var(--success); }
.log { display: grid; grid-template-columns: 64px repeat(7, 1fr); gap: 4px; align-items: stretch; }
.log .hd { font-size: .6875rem; font-weight: 600; color: var(--text-2); text-align: center; text-transform: uppercase; }
.log .rl { font-size: .75rem; color: var(--text-2); align-self: center; line-height: 1.2; }
.log .rl b { display: block; color: var(--text); font-weight: 600; }
.cell { background: var(--raised); border-radius: 8px; min-height: 58px; padding: 5px 3px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 2px; }
.cell .ts { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; }

        var x0 = x(e.s), x1 = x(e.e);
        if (x1 - x0 <= 1) return;
        h += '<rect x="' + (x0 + 0.5).toFixed(1) + '" y="4" width="' + (x1 - x0 - 1).toFixed(1) + '" height="22" rx="4" style="fill:var(--cal)"/>' + lbl(x0, x1, e.t, "var(--cal-text)");
      });
      plans.concat(d.add ? [d.add] : []).forEach(function (p) {
        if (p.s == null || p.struck) return;
        var sugg = p === d.add, col = TCOL[String(p.type).split(":")[0]] || "var(--primary)", x0 = x(p.s), x1 = Math.max(x(p.e), x0 + 8);
        h += '<rect x="' + x0.toFixed(1) + '" y="4" width="' + (x1 - x0).toFixed(1) + '" height="22" rx="4" style="fill:' + (sugg ? "var(--surface)" : col) + ";stroke:" + col + ";stroke-width:1.5" + (sugg ? ";stroke-dasharray:3 2" : "") + '"/>';
      });
      s.innerHTML = h;
      body.appendChild(s);
      var ev = events.map(function (e) { return fmtH(e.s) + " " + e.t; });
      if (d.allday) ev.unshift("All day: " + d.allday);
      if (ev.length) body.appendChild(el("div", "evs", ev.join(" · ")));
      (d.board || []).forEach(function (b) { body.appendChild(el("div", "evs hive", [hiveMark(), el("span", null, "Due: " + b.title)])); });
      if (d.note) body.appendChild(el("div", "evs", d.note));
      if (d.sg) { var sg = el("span", "sg", [el("i", null, d.sg.kind), d.sg.text]); sg.style.setProperty("--kc", KCOL[d.sg.kind] || "var(--primary)"); body.appendChild(sg); }
      wk.appendChild(el("div", "wd", [el("div", "dt", [el("span", null, d.dow), el("b", "num", d.n)]), body]));
    });
    var lg = el("div", "lgd");
    [["var(--t-weight)", "Planned session, in its type colour"], ["var(--cal)", "Calendar event"], ["var(--strip-night)", "Before sunrise, after sunset"]].forEach(function (k) { var sp = el("span", null, k[1]); sp.style.setProperty("--c", k[0]); lg.appendChild(sp); });
    var dl = el("span", null, "Dashed outline: suggested, or an all-day event"); dl.style.setProperty("--c", "transparent"); lg.appendChild(dl);
    c.appendChild(lg);
  })();

  // Looking back: last week against the week before
  if (D.back) (function () {
    var B = D.back;
    var hdr = el("header", "top", [el("div", "meta", B.range), el("h1", null, "Last week")]);
    hdr.querySelector("h1").style.fontSize = "1.75rem";
    hdr.style.paddingTop = "12px";
    root.appendChild(hdr);
    if (B.stats) root.appendChild(el("div", "grid g2 g4", B.stats.map(function (s) {
      return el("div", "card stat", [el("span", "k", s.k), figure("v", s.v, s.u), s.d ? el("span", "d" + (s.up ? " up" : ""), (s.up ? "▲ " : "") + s.d) : null, s.sub ? el("span", "sub", s.sub) : null]);
    })));
    if (B.log) {
      var lc = card("Two weeks of training", "load", "session types · effort underline · COROS load");
      var log = el("div", "log", [el("span")]);
      ["M", "T", "W", "T", "F", "S", "S"].forEach(function (d) { log.appendChild(el("span", "hd", d)); });
      B.log.forEach(function (w) {
        log.appendChild(el("span", "rl", [el("b", null, w.label), w.sub || ""]));
        w.days.forEach(function (d) {
          var ts = el("div", "ts");
          (d.ts || []).forEach(function (t) {
            var base = String(t[0]).split(":")[0], sp = el("span", null, [icon(base)]);
            sp.style.setProperty("--tc", TCOL[base] || "var(--primary)");
            if (t[1]) sp.style.setProperty("--ec", ECOL[t[1]]);
            sp.title = t[0] + (t[1] ? ", " + t[1] : ", effort not rated");
            ts.appendChild(sp);
          });
          log.appendChild(el("div", "cell" + (d.ts && d.ts.length ? "" : " rest"), [ts, el("span", "ld num", d.load == null ? "–" : String(d.load))]));
        });
      });
      lc.appendChild(log);
      var key = el("div", "key");
      [["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"]].forEach(function (k) { var s = el("span", null, k[1]); s.style.setProperty("--ec", ECOL[k[0]]); key.appendChild(s); });
      lc.appendChild(key);
      if (B.note) { var n = el("p", "sub", B.note); n.style.marginTop = "8px"; lc.appendChild(n); }
      if (B.drinks) { var dk = el("p", "sub", [icon("water"), " Drinks: " + B.drinks]); dk.style.marginTop = "6px"; lc.appendChild(dk); }
      root.appendChild(lc);
    }
  })();

  // Recovery, week against week
  if (D.recovery) (function () {
    var R = D.recovery;
    if (R.story && R.story.length) {
      var rc = card("Recovery", "hrv", "week against week", "var(--hrv)");
      rc.appendChild(el("div", "story", R.story.map(function (t) { return el("p", null, t); })));
      root.appendChild(rc);
    }
    if (!R.metrics) return;
    var g = el("div", "grid g3");
    R.metrics.forEach(function (m) {
      var col = MCOL[m.k], cc = el("div", "card mt");
      var k = el("div", "k", [icon(m.k), m.label + ", average"]); k.style.setProperty("--c", col);
      cc.appendChild(k);
      cc.appendChild(figure("val", m.value, m.unit));
      if (m.d) cc.appendChild(el("div", "sub", [el("b", null, m.d), " on the week before" + (m.prev ? " (" + m.prev + ")" : "")]));
      var split = m.split || 7, series = m.series || [], vals = series.filter(function (v) { return v != null; });
      if (vals.length > 1) {
        var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), sp = Math.max(hi - lo, 1), n = series.length;
        var X = function (i) { return 4 + i * 132 / (n - 1); }, Y = function (v) { return 36 - (v - lo) / sp * 32; };
        var mean = function (a) { a = a.filter(function (v) { return v != null; }); return a.length ? a.reduce(function (s, v) { return s + v; }, 0) / a.length : null; };
        var m0 = mean(series.slice(0, split)), m1 = mean(series.slice(split)), mid = ((X(split - 1) + X(split)) / 2).toFixed(1);
        var segs = [], cur = [];
        series.forEach(function (v, i) { if (v == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push(X(i).toFixed(1) + "," + Y(v).toFixed(1)); });
        if (cur.length) segs.push(cur);
        var s = document.createElementNS(NS, "svg"); s.setAttribute("class", "spark"); s.setAttribute("viewBox", "0 0 140 40"); s.setAttribute("preserveAspectRatio", "none");
        s.setAttribute("role", "img"); s.setAttribute("aria-label", m.label + " each night over two weeks, with each week's average");
        s.innerHTML = '<rect x="0" y="0" width="' + mid + '" height="40" style="fill:var(--raised)"/>' +
          (m0 != null ? '<line x1="0" x2="' + mid + '" y1="' + Y(m0).toFixed(1) + '" y2="' + Y(m0).toFixed(1) + '" style="stroke:var(--text-2);stroke-dasharray:3 3" vector-effect="non-scaling-stroke"/>' : "") +
          (m1 != null ? '<line x1="' + mid + '" x2="140" y1="' + Y(m1).toFixed(1) + '" y2="' + Y(m1).toFixed(1) + '" style="stroke:' + col + ';stroke-dasharray:3 3" vector-effect="non-scaling-stroke"/>' : "") +
          segs.map(function (p) { return '<polyline points="' + p.join(" ") + '" style="fill:none;stroke:' + col + ';stroke-width:2;stroke-linejoin:round" vector-effect="non-scaling-stroke"/>'; }).join("");
        cc.appendChild(s);
        cc.appendChild(el("div", "range-l", [el("span", null, "week before"), el("span", null, "last week")]));
      }
      if (m.sub) cc.appendChild(el("div", "sub", m.sub));
      g.appendChild(cc);
    });
    root.appendChild(g);
  })();

  // Body beside board
  (function () {
    var row = [];
    if (D.body) {
      var y = D.body, yc = card("Body", "body", "weekly average weight");
      yc.appendChild(figure("big", y.value, y.unit));
      if (y.d || y.sub) yc.appendChild(el("div", "sub", [y.d ? el("b", null, y.d + " ") : null, y.sub || ""]));
      var ser = y.series || [], n = ser.length;
      if (n > 1) {
        var lo = Math.min.apply(null, ser), hi = Math.max.apply(null, ser), sp = Math.max(hi - lo, 1), split = y.split || 7;
        var X = function (i) { return 4 + i * 132 / (n - 1); }, Y = function (v) { return 38 - (v - lo) / sp * 32; };
        var avg = function (a) { return a.reduce(function (s, v) { return s + v; }, 0) / a.length; };
        var a0 = avg(ser.slice(0, split)), a1 = avg(ser.slice(split)), mid = ((X(split - 1) + X(split)) / 2).toFixed(1);
        var s = document.createElementNS(NS, "svg"); s.setAttribute("class", "spark"); s.setAttribute("viewBox", "0 0 140 44"); s.setAttribute("preserveAspectRatio", "none");
        s.setAttribute("role", "img"); s.setAttribute("aria-label", "Weight readings over two weeks, with each week's average");
        s.innerHTML = ser.map(function (v, i) { return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="2" style="fill:var(--text-2);opacity:.6"/>'; }).join("") +
          '<line x1="0" x2="' + mid + '" y1="' + Y(a0).toFixed(1) + '" y2="' + Y(a0).toFixed(1) + '" style="stroke:var(--text-2);stroke-width:2" vector-effect="non-scaling-stroke"/>' +
          '<line x1="' + mid + '" x2="140" y1="' + Y(a1).toFixed(1) + '" y2="' + Y(a1).toFixed(1) + '" style="stroke:var(--primary);stroke-width:2.5" vector-effect="non-scaling-stroke"/>';
        s.style.marginTop = "8px"; s.style.height = "48px";
        yc.appendChild(s);
        yc.appendChild(el("div", "range-l", [el("span", null, "week before"), el("span", null, "last week")]));
      }
      if (y.bp) yc.appendChild(el("div", "bp", [el("span", null, "Blood pressure"), el("b", "num", y.bp), y.bpSub ? el("span", "sub", y.bpSub) : null]));
      row.push(yc);
    }
    if (D.board) {
      var b = D.board, bc = card("Board", "hive", "Hive");
      [["Finished this week", b.done, function () { return el("span", "tag", "Done"); }],
       ["Overdue", b.overdue, function (o) { return el("span", "tag late", o.days + "d overdue"); }],
       ["In progress", b.open, function (o) { return el("span", "tag", o.status || "open"); }],
       ["Up next", b.soon, function (o) { return el("span", "tag", o.due); }]].forEach(function (grp) {
        if (!grp[1] || !grp[1].length) return;
        bc.appendChild(el("div", "lbl", grp[0]));
        grp[1].forEach(function (o) { bc.appendChild(el("div", "item", [el("span", null, o.title), o.board ? el("span", "bd", o.board) : null, grp[2](o)])); });
      });
      if (b.note) { var bn = el("p", "sub", b.note); bn.style.marginTop = "8px"; bc.appendChild(bn); }
      row.push(bc);
    }
    if (row.length) root.appendChild(el("div", "grid" + (row.length > 1 ? " g2" : ""), row));
  })();

  if (D.foot) root.appendChild(el("p", "foot", D.foot));
})();
</script>
